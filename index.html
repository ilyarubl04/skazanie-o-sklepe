<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сказание о Старом Склепе</title>
<meta name="description" content="Настольное D&D-приключение для двоих в браузере: ИИ-мастер ведёт историю, ты сам бросаешь кубик, живой рассказчик и музыка. Бесплатно, на одном устройстве.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://skazanie-o-sklepe-rublevsky.netlify.app/">
<meta property="og:title" content="Сказание о Старом Склепе">
<meta property="og:description" content="Настольное D&D-приключение для двоих: ИИ-мастер, бросок кубика своими руками, живой рассказчик и музыка. Открой и играй.">
<meta property="og:image" content="https://skazanie-o-sklepe-rublevsky.netlify.app/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Сказание о Старом Склепе">
<meta name="twitter:description" content="Настольное D&D-приключение для двоих: ИИ-мастер, кубик, рассказчик и музыка.">
<meta name="twitter:image" content="https://skazanie-o-sklepe-rublevsky.netlify.app/assets/og-image.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0a04">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head><body>
  <!-- atmospheric scene backgrounds (crossfade between the two layers) -->
  <div id="bg-a" class="scene-bg"></div>
  <div id="bg-b" class="scene-bg"></div>
  <div id="bg-veil"></div>

  <audio id="music" loop></audio>
  <audio id="vo"></audio>

  <!-- top bar -->
  <div id="topbar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:60;
       text-align:center;padding:6px;font-family:'Forum, Georgia, serif';background:rgba(15,10,4,.85);border-bottom:1px solid var(--gold);">
    <span id="turn-indicator"></span>
    <button id="btn-music" class="mini" title="Музыка" aria-label="Музыка">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
    <button id="btn-sound" class="mini" title="Звук" aria-label="Звук">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
    </button>
    <button id="btn-voice" class="mini" title="Голос рассказчика" aria-label="Голос рассказчика">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
    </button>
    <button id="btn-help" class="mini" title="Как играть" aria-label="Как играть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.8 2.4-2.8 4"/><circle cx="11.9" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="btn-map" class="mini" title="Карта похода" aria-label="Карта похода" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
    </button>
    <button id="btn-menu" class="mini" title="Меню" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
  </div>

  <!-- main menu -->
  <div class="screen active" id="screen-menu">
    <h1 class="title">Сказание<br>о Старом Склепе</h1>
    <p class="flavor" style="text-align:center">Приключение для двоих. Мастер ведёт вас сам.</p>
    <button class="choice" id="btn-new">Новая игра</button>
    <button class="choice" id="btn-continue">Продолжить</button>
    <button class="choice" id="btn-credits">Титры</button>
  </div>

  <!-- hero select -->
  <div class="screen" id="screen-select">
    <h2 id="select-prompt">Игрок 1 — выбери героя</h2>
    <div class="hero-grid" id="hero-grid"></div>
    <div id="hero-detail" style="display:none;"></div>
  </div>

  <!-- scene -->
  <div class="screen" id="screen-scene">
    <div class="panel narration" id="scene-text"></div>
    <div id="scene-actions"></div>
    <div id="dice-tray"></div>
    <div class="party-rail" id="scene-party"></div>
  </div>

  <!-- combat -->
  <div class="screen" id="screen-combat">
    <div id="combat-enemies"></div>
    <div id="combat-actions"></div>
    <div class="panel" id="combat-log" style="max-height:160px;overflow:auto;"></div>
    <div id="dice-tray-combat"></div>
    <!-- expanded hero cards reflect live HP and highlight the active player -->
    <div class="party-rail" id="combat-heroes"></div>
  </div>

  <!-- world map (2.5D overworld) -->
  <div class="screen" id="screen-map">
    <canvas id="map-canvas" aria-label="Карта похода"></canvas>
    <div id="map-hint" class="flavor">Выберите, куда направиться</div>
  </div>

  <!-- pass device -->
  <div class="screen" id="screen-pass">
    <h2 id="pass-text" style="text-align:center;margin-top:26vh;">Передайте устройство</h2>
    <p id="pass-recap" class="flavor" style="text-align:center;display:none;max-width:34ch;margin:0 auto 10px;"></p>
    <button class="choice" id="btn-pass-ok">Готово</button>
  </div>

  <!-- ending -->
  <div class="screen" id="screen-ending">
    <div class="panel narration dropcap" id="ending-text"></div>
    <button class="choice" id="btn-again">Сыграть снова</button>
  </div>

  <!-- credits -->
  <div class="screen" id="screen-credits">
    <h2>Титры</h2>
    <div class="panel" id="credits-body"></div>
    <button class="choice" id="btn-credits-back">Назад</button>
  </div>

  <script src="js/dice.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/bestiary.js"></script>
  <script src="js/adventure.js"></script>
  <script src="js/worldmap.js"></script>
  <script src="js/state.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dicethrow.js"></script>
  <script src="js/main.js"></script>
</body></html>
